version: "3.8"

# ==============================================================================
# DaashTics Monorepo Docker Compose Orchestration
# Services: PostgreSQL 16 DB + Flask REST API / AI Engine + Next.js 14 Frontend
# ==============================================================================

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: daashtics_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daashtics_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-daashtics_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - daashtics_network

  # 2. Flask REST API & YOLO Computer Vision Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daashtics_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-daashtics_db}
      SECRET_KEY: ${SECRET_KEY:-daashtics_enterprise_secret_production_key_2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      WA_API_URL: ${WA_API_URL:-}
      WA_API_TOKEN: ${WA_API_TOKEN:-}
      ENABLE_AGGRESSIVE_CLEANUP: "false"
    ports:
      - "5000:5000"
    networks:
      - daashtics_network

  # 3. Next.js 14 Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: daashtics_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      BACKEND_URL: http://backend:5000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - "3000:3000"
    networks:
      - daashtics_network

volumes:
  postgres_data:
    driver: local

networks:
  daashtics_network:
    driver: bridge
